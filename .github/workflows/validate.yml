name: Validate review repository

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata, evidence matrix and precision records
        shell: pwsh
        run: ./scripts/validate_repo.ps1
      - name: Test CSV freshness validation
        shell: pwsh
        run: ./scripts/tests/test_validation.ps1
